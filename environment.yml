name: r_env
channels:
  - conda-forge
  - defaults
dependencies:
  # --- R dependencies ---
  - r-base=4.4.2
  - r-cmdstanr=0.8.1
  - r-brms=2.22.0
  - r-stringr=1.5.1
  - r-tidytable=0.11.1
  - r-readxl=1.4.3
  - r-ggplot2=3.5.1
  - r-devtools=2.4.5
  - r-argparse=2.2.5
  - r-png=0.1
  - r-reticulate=1.46.0
  - r-R.matlab=3.7.0

  # ---- Toolchain (REQUIRED for CmdStan) ----
  - make=4.4.1

  # --- Python (for pangoling) ---
  - python=3.11.0